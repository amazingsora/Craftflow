# Craftflow — Checkpoint → Prompt Style 對照表
#
# 規則：
#   key   = checkpoint 檔名的關鍵字（不含副檔名，大小寫不分）
#   value = 對應的 prompt style（sdxl / pony / flux / noobai / illustrious）
#
# 新增模型時，只要在這裡加一行，不需要改任何程式碼。
# 若 checkpoint 名稱不在清單內，系統預設使用 sdxl。

checkpoints:
  # ── Anything XL 系列 ───────────────────────────────────────
  AnythingXL:       anythingxl
  anythingXL:       anythingxl

  # ── SDXL 系列 ──────────────────────────────────────────────
  BluePencilXL:     sdxl
  CounterfeitXL:    sdxl
  DreamShaperXL:    sdxl
  JuggernautXL:     sdxl
  RealVisXL:        sdxl
  # 2026-09-16 SYNC-003 A1：Animagine XL 4.0（SDXL）。**必須排在下方 catch-all "anima" 之前**——
  # 比對是子字串，"animaginexl" 含 "anima"，漏登錄時會被誤判成 Anima（07-25 AC-1 起的回歸）。
  animagineXL:      sdxl

  # ── Pony 系列 ──────────────────────────────────────────────
  ponyDiffusion:    pony
  autismmixSDXL:    pony
  prefectPonyXL:    pony

  # ── Flux 系列 ──────────────────────────────────────────────
  flux1-dev:        flux
  flux1-schnell:    flux
  fluxDev:          flux

  # ── NoobAI 系列 ────────────────────────────────────────────
  noobaiXL:         noobai
  noobAI:           noobai

  # ── Illustrious 系列 ───────────────────────────────────────
  illustriousXL:    illustrious
  IllustriousXL:    illustrious
  illustrious-xl:   illustrious    # Illustrious-XL-v2.0 等帶連字號命名
  fabricatedXL:     illustrious    # Fabricated XL v7.0（Illustrious 衍生；V36 主底模）
  novaAnimeXL:      illustrious    # 2026-07-25 補登錄：Illustrious 衍生，原漏登錄→誤判 sdxl

  # ── Anima 系（非 SDXL：UNETLoader + Qwen 編碼器）──────────────
  # 2026-07-25 AC-1：新增 anima family（PromptStyle.ANIMA）。
  # 順序重要——"anima" 較短，須排在 "anima_base" 之後才不會先命中。
  # 2026-08-17：補登錄 anima_aesthetic（Anima-Aesthetic v1.1，AnimaStandardV8 底模）。
  # ⚠️ 明示登錄純為可追溯性——實測 "anima_aestheticV11" 本來就會命中下方 catch-all
  #    "anima"，本行是零行為變更。留著是為了讓「哪些 Anima 版本在用」一眼可見，
  #    並在日後需要把 aesthetic 拆成獨立 family（如採樣參數分家）時有現成掛點。
  anima_base:       anima
  anima_aesthetic:  anima
  anima:            anima

# ── Checkpoint → 架構家族對照（IPA/CN 能力閘控用）──────────────────────────
# key   = checkpoint 檔名關鍵字（同 checkpoints 區段，大小寫不分）
# value = 架構家族；用於查 services/ai/capability.py INJECT_MODELS 表
# 未列  = fallback sdxl（零行為變更）；flux 不支援注入（前端隱藏 IPA/CN）
families:
  # ── SDXL 原生 ───────────────────────────────────────────────────────────────
  AnythingXL:       sdxl
  anythingXL:       sdxl
  BluePencilXL:     sdxl
  CounterfeitXL:    sdxl
  DreamShaperXL:    sdxl
  JuggernautXL:     sdxl
  RealVisXL:        sdxl
  animagineXL:      sdxl           # 2026-09-16 SYNC-003 A1：同上區，須排在 "anima" 之前

  # ── Pony（SDXL 架構，沿用 SDXL 注入模型）──────────────────────────────────
  ponyDiffusion:    pony
  autismmixSDXL:    pony
  prefectPonyXL:    pony

  # ── Illustrious（SDXL 架構）────────────────────────────────────────────────
  illustriousXL:    illustrious
  IllustriousXL:    illustrious
  illustrious-xl:   illustrious
  fabricatedXL:     illustrious
  novaAnimeXL:      illustrious    # 2026-07-25 補登錄（原漏 → fallback sdxl，影響所有以其為全域 checkpoint 的生成）

  # ── NoobAI（SDXL 架構）─────────────────────────────────────────────────────
  noobaiXL:         noobai
  noobAI:           noobai

  # ── Flux（不支援 IPA/CN 注入）──────────────────────────────────────────────
  flux1-dev:        flux
  flux1-schnell:    flux
  fluxDev:          flux

  # ── Anima（非 SDXL：UNETLoader + Qwen 編碼器；無 IPA、CN 僅 LLLite → 能力閘控停用）
  # 2026-08-17：aesthetic v1.1 與 base v1.0 同架構（同 Cosmos-Predict2-2B 衍生、同
  # Qwen 編碼器/VAE），能力閘控完全一致 → 同 family，不另立。
  anima_base:       anima
  anima_aesthetic:  anima
  anima:            anima
