# Craftflow — Workflow 級 Prompt Profile（P1，2026-07-12）
#
# key   = workflow 檔名（data/custom_workflows/ 或系統 workflow 目錄下的檔名，含副檔名）
# value = quality_prefix / quality_suffix / negative / negative_extra / style_extra /
#         style_extra_weight，皆可省略；省略的欄位不覆寫，落回下一優先序（見下）。
#
# negative（取代語義）vs negative_extra（補充語義，R4，2026-07-14）：
#   negative       = 取代整個 negative 主體（優先序見下）。
#   negative_extra = 不取代，附加於已選定的 negative 之後——family/art_style/PERSONAL_NEGATIVE
#                    既有負向都保留，只是再補一段。兩者可同時登錄，也可只用其一。
#
# style_extra / style_extra_weight（P5-5，2026-08-26）：
#   compile() 之後、service 層組裝 final_positive 時使用的畫風 tag／權重，供不同底模
#   （Illustrious CLIP 語彙 vs Anima Qwen3 白話語彙）登錄各自適配的配方。
#   解析在 character_design_service.py 的 _resolve_style_extra()，**不經** compile_prompt()
#   kwargs（詳見 workflow_builder.py 的 _workflow_style_extra() docstring）。
#   優先序：art_style.extra_tags（DB）> 這裡的 style_extra > .env PERSONAL_STYLE_EXTRA_TAGS
#          > 無；weight 同理：這裡的 style_extra_weight > .env PERSONAL_STYLE_WEIGHT。
#   未登錄＝零介入，落回 .env（零回歸）。實際配方登錄見 P5-6/7/8（本檔暫未登錄任何值）。
#
# 解析優先序（quality_prefix / quality_suffix / negative / negative_extra，各自獨立判斷）：
#   art_style 個別欄位  >  這裡的 workflow profile  >  checkpoint family（prompt_engine/styles.py STYLE_CONFIG）
#
# 未登錄的 workflow 檔名＝這份設定完全不介入，行為與新增本機制前一致（零回歸）。
#
# quality_suffix：附加在 compile() 組出的 body 之後（角色/畫風 tags 之前），用於需要
# 「尾綴權重 tag」（如官方範例的 pixiv 尾綴 `(:0.6)`）的 workflow。
# 2026-07-26（G-2）：Standard_V37 曾啟用。
# 2026-08-12（R4-D）：Standard_V37 已停用該欄位（機制保留），改回不加尾綴。

# ── 檔名改版與 YAML anchor（SYNC-001，2026-09-15）────────────────────────────
# 本機制的鍵是 **workflow 檔名**，檔名一改就整組脫鉤，且 workflow_builder 的查表是
# 精確比對、miss 不告警 → 靜默落回 family + .env。2026-09-15 盤點時六個現役 workflow
# （*_V38 / *_Aesthetic / *_trubo11）全部 miss，08-12～08-26 三輪 P5 調校成果 100% 未生效。
# 證據：doc/target/角色管理功能改進方案_20260915.docx「二、工具結果」四張圖的 prompt 帶
#   `amazing quality`（illustrious family 預設）、`ultra detailed, high contrast`（anima
#   family 預設）與 `(flat color:1.2)…`（.env PERSONAL_STYLE_EXTRA_TAGS），皆非本檔配方。
# 修法有二，都做：
#   1) 本檔用 YAML **anchor/merge key**（`&名稱` 定義、`<<: *名稱` 併入）把「同一顆底模的
#      配方」寫一次、多個檔名共用 —— 直接消滅本檔原先自承的「兩份真相風險」。
#      PyYAML 的 safe_load 支援 merge key（已驗證）；改 anchor 來源＝所有引用者一起改。
#   2) workflow_builder._profile_for() 在 miss 時記 WARNING（同一檔名只記一次），
#      並把來源寫進 generation_history.params.prompt_profile ——下次改名不會再默默降級。
# ⚠️ 新增／改名 workflow 時，**務必同步在本檔登錄**；
#    backend/tests/test_workflow_builder.py::test_all_custom_workflows_are_registered 會擋。

profiles:
  Standard_V37.json: &illustrious_fabricatedxl
    # 2026-07-12 實測三版對照（doc/2026-07-12_工作流提示詞優化規劃.md 表格）：
    # C 官方簡化版，介於 A(官方權重版)/B(現行強化版) 之間、平衡最佳 → 曾暫定採用。
    # G-1（2026-07-26）：對齊 V37 工作流內建 wildcard（node 3）與附件三 metadata 的
    # 品質段——補 (newest:0.6) 與 very aesthetic，並改用權重群組語法。
    # 權重語法安全性：compiler.compile 已對 override 做 _WEIGHT_GROUP_RE 展開後併入
    # banned_tags（compiler.py:275-278），LLM 重複吐 highres/absurdres 仍會被剝除。
    # R4-C（2026-08-12）：回滾 G-1 的美學加權段，退回樸素三段。理由見 08-05 開發記錄
    # 第十三節——A（拿掉 BA LoRA）已驗有效，C/D/E 是同一組假設的其餘三項：
    # (newest:0.6) 與 very aesthetic 屬「風格美學」而非「品質」訴求，疑為出圖蒼白扁平
    # 的推手之一。對照組（G-1 版）保留於下行註解，改 yml 免重啟即生效（無程式相依）。
    #   G-1 對照：masterpiece, best quality, (newest:0.6), (highres, absurdres, very aesthetic:0.8)
    quality_prefix: "masterpiece, best quality, absurdres"
    # R4-D（2026-08-12）：停用尾綴美學段。機制本身保留（compiler.py:359-364），只是本
    # profile 不再登錄該欄位 → 落回 family（無 suffix），等同不加。回滾＝取消下行註解。
    # quality_suffix: "(A highly aesthetic illustration, clean composition, high-quality digital art, sharp focus on facial expressions:0.6)"
    # negative：B 版（illustrious 強化版 + worst detail/patreon/浮水印署名 + 抑制
    # detailed background/scenery，人設圖 profile 禁用場景細節），實測優於官方短版。
    #   R4-E（2026-08-12）移除 "sketch"：與本專案的 clean lineart 訴求直接對衝。
    #   P1-1（2026-08-12）補環境/投影抑制，對應 R3「人設圖出現地面投影陰影」。
    #   ⚠️ 刻意不加裸 "shadow"：danbooru 語彙中它涵蓋角色身上的 shading，放進 negative
    #      會連立體光影一起壓掉、人物變平面。此處只擋落地投影與地面/反射等環境物件。
    negative: >-
      worst quality, low quality, lowres, bad anatomy, bad hands, bad proportions,
      missing fingers, extra digits, fewer digits, fused fingers, jpeg artifacts,
      signature, watermark, username, text, blurry, cropped, extra limbs,
      worst detail, patreon, twitter username, detailed background, scenery,
      drop shadow, cast shadow, floor, ground, reflection

    # ── style_extra（P5-7，2026-08-26）─────────────────────────────────────
    # 規劃書 `doc/target/畫風強化_開發規劃_20260826.md` §4.2 Illustrious 版配方。
    # 設計約束（§4.1）：≤5 tag、不含版權詞/具名角色（P5-4 已否決）、不與上面
    # quality_prefix 的 masterpiece/best quality/absurdres 重複、避開 "lineart"
    # 字樣（styles.py:101 _LINEART_ARTIFACT_RE 只清 LLM 輸出、不清這裡，
    # 這種不對稱是脆弱前提，改用語意等價的 thick outlines）。
    # weight 1.2：CLIP 語彙的量級。**起始值非定案**，三檔位 A/B 見 P5-10。
    # ── C4（SYNC-004，2026-09-19）：五項 → 三項，weight 維持 1.2 ──────────────
    # 依據 T0-E2（AGENT_SYNC §2.5）：T0-2 官方復刻圖呈現乾淨平塗＋銳利描邊＋高飽和，
    # 而它的正向 prompt 裡**一個平塗算子都沒有**。底模原生就會平塗 → 我們這五個同義
    # 算子不只多餘，還在互相稀釋（"flat color" / "cel shading" / "anime coloring"
    # 三者語義高度重疊，_dedup_tags 比對的是完整 tag 字串，收斂不掉）。
    # 保留最不可替代的三項：上色方式（flat color）、陰影形式（cel shading）、
    # 線條強度（thick outlines）。拿掉 "vibrant colors"（飽和度應由底模與背景色決定，
    # 硬推會把深灰戰鬥服也拉艷）與 "anime coloring"（與前兩項同義）。
    #
    # ⚠️ **weight 刻意維持 1.2，不改 1.0** —— AGENT_SYNC §2.4 的 C4 原案寫「1.2→1.0」是錯的：
    #    character_design_service.py:821 是 `if _style_weight != 1.0:`，設成 1.0 會走 else 分支，
    #    畫風 tag 從「加權＋前置到 identity 區塊」變成「不加權＋append 到 prompt 最尾端」
    #    （即 A3 P1-4 特地修掉的 D4 死代碼行為，會被 ComfyUI chunk 稀釋）。
    #    那是**位置與權重兩個變因一起動**，違反單變因原則。要調權重請用 1.1，不要用 1.0。
    # **回滾＝改回下行註解的五項版本**：
    #   style_extra: "flat color, cel shading, thick outlines, vibrant colors, anime coloring"
    # ── 2026-09-20：flat color 單獨降權（實測 v1→v5）───────────────────────
    # 症狀：出圖平圖感重、衣服沒有光影（使用者實測 v1）。根因＝flat color 與
    # cel shading 同為 1.2 互相對衝，平塗算子壓過硬邊陰影。
    # 反例（不要重犯）：v2 曾改為「刪 flat color ＋ 負向補 no shading ＋ 加
    # rim lighting/soft shadows/subsurface scattering」→ 皮膚與布料變油亮膠感、
    # 整體品質下降。寫實光影詞與 cel shading 語義直接對衝，不可混用。
    # 本次作法：只降 flat color 一項，其餘兩項維持 1.2（單變因）。
    # 機制：character_design_service.py:821 對每個 tag 統一包 (tag:weight)，
    # 無 per-tag 權重欄位 → 用巢狀權重繞過。展開後 ((flat color:0.5):1.2)，
    # ComfyUI parser 相乘 ⇒ 有效 0.6；cel shading / thick outlines 仍為 1.2。
    # ⚠️ style_extra_weight 不可改 1.0（會走 else 分支，畫風 tag 由前置變尾端
    #    append，位置與權重雙變因）。
    # ⚠️ 副作用：_dedup_tags（image_ops.py:102-104）正規化後得 `flat color:0.5)`，
    #    不再等於 `flat color` ⇒ LLM 若也吐 flat color 不會被去重。驗收時看
    #    generation_history 正向是否只有一處 flat color；若出現兩處，退路是直接
    #    把 flat color 從本行移除（等同 0），不要再疊語法。
    # 回滾：本行改回下一行註解的原值。
    #   style_extra: "flat color, cel shading, thick outlines"
    style_extra: "(flat color:0.7), cel shading, thick outlines"
    style_extra_weight: 1.2

