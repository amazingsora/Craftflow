    # 不含 score_*（Aesthetic/Turbo 官方明令，同上面 negative 的處理）。
    # **起始值非定案**，1.0/2.0/3.0 三檔位 A/B 見 P5-10。
    # 去重（2026-08-26）：原第四項 "anime style illustration" 與 prompt 既有的
    # "anime style"（compile 端）＋ "character illustration"（_build_fullbody_suffix，
    # character_design_service.py:438）三重同義。_dedup_tags 比對的是去權重後的完整
    # tag 字串，"anime style illustration" ≠ "anime style" → 收斂不掉，等於用 2.0 的
    # 權重重複強調一個 prompt 裡已經講兩次的概念，稀釋另外三項。
    # **回滾＝改用下行註解的四項版本**：
    #   style_extra: "flat cel shaded coloring, bold clean outlines, saturated colors, anime style illustration"
    style_extra: "flat cel shaded coloring, bold clean outlines, saturated colors"
    style_extra_weight: 2.0

  # ══════════════════════════════════════════════════════════════════════════
  # 現役 workflow 登錄（SYNC-001，2026-09-15）
  # ══════════════════════════════════════════════════════════════════════════
  # 上面四筆是歷史檔名（V37/V35 已移入 data/custom_workflows/history/，
  # AnimaStandardV8.json / AnimaStandardV8turbo.json 已改名），留著是因為它們
  # 承載了配方的**推導過程與回滾說明**，且現在是下面 merge key 的 anchor 來源。
  # 下面六筆才是 data/custom_workflows/ 磁碟上的實際檔名。
  #
  # 每一筆都只寫 `<<: *anchor`，**不重抄任何字串** —— 要改配方就改上面的 anchor 來源，
  # 引用者自動跟著改。這是本檔原先自承「本機制沒有『移除單項』語義 → 不得不抄一份
  # family negative」那個兩份真相風險的正解。
  #
  # 為什麼 V38 直接沿用 V37 的配方：兩者同一顆 checkpoint
  # （`fabricatedXL_v70.safetensors`，見 Standard_V38.json node 30 / Advanced_V38.json
  # node 103），checkpoint_styles.yml 同判 illustrious family。配方跟著底模走，不跟版號走。
  #
  # 為什麼四個 Anima 檔共用同一份：Aesthetic v1.1 與 Turbo v1.1 是同一支模型的精修版
  # 與其蒸餾版，**prompt 規則同源**（官方對兩者都明令正負向不得用 score_*）。差異在
  # **採樣參數**（cfg/steps），那是 workflow JSON node 級的事，不歸本檔管（SYNC-001 §2.4 C 案）。
  #
  # ⚠️ `trubo` 是既有檔名的既有拼字（不是待修 typo）。改名＝再一次脫鉤，
  #    要改必須連同本檔與任何引用一起改，本輪不改。

  # ── Illustrious / fabricatedXL_v70 ────────────────────────────────────────
  Standard_V38.json:
    <<: *illustrious_fabricatedxl
  Advanced_V38.json:
    <<: *illustrious_fabricatedxl

  # ── Standard_V38_NOVE.json（SYNC-005 軌 E，2026-09-19）─────────────────────
  # 底模 novaAnimeXL_ilV190.safetensors（Illustrious 衍生，checkpoint_styles.yml 同判
  # illustrious family）→ 沿用同一份 anchor，配方跟著底模走、不跟版號走。
  #
  # ⚠️ 補登錄的理由是實錘而非預防：本檔未登錄它之前，generation_history #647
  #    （2026-09-19 12:50 UTC）的正向是
  #      `(flat color:1.2), (cel shading:1.2), (anime coloring:1.2), masterpiece,
  #       best quality, amazing quality, absurdres, ...`
  #    逐項比對 —— `anime coloring` 來自 .env PERSONAL_STYLE_EXTRA_TAGS、
  #    `amazing quality` 來自 styles.py 的 illustrious family 預設、weight 1.2 來自
  #    .env PERSONAL_STYLE_WEIGHT。三者都不是本檔配方 ⇒ 它整組落回 family + .env，
  #    與 Standard_V38 / Advanced_V38 的配方**不同**。
  #    拿它跟那兩支比較 = 「底模」與「prompt 配方」雙變因，結論不可用。
  #    這正是 SYNC-001 的原始災情，第二次以同樣形式復發。
  Standard_V38_NOVE.json:
    <<: *illustrious_fabricatedxl

  # ── Anima / anima_aestheticV11 ＋ anima_turboV11 ───────────────────────────
  AnimaStandardV8_Aesthetic.json:
    <<: *anima_aesthetic_turbo
  AnimaStandardV8_trubo11.json:
    <<: *anima_aesthetic_turbo
  AnimaAdvancedV8_Aesthetic.json:
    <<: *anima_aesthetic_turbo
  AnimaAdvancedV8_trubo11.json:
    <<: *anima_aesthetic_turbo

  # ── SYNC-004 A 軌對照組（2026-09-19）────────────────────────────────────────
  # 使用者要求：不就地改，改為產生 `_0919` 新檔與原檔做 A/B，因此磁碟上同時存在
  # 「舊參數版」與「新參數版」八支 Anima workflow。
  #
  # ⚠️ 新檔名 = 又一次的檔名脫鉤風險（SYNC-001 就是被這個咬的）。本機制的鍵是**檔名**，
  #    `_0919` 四支若不登錄就會靜默落回 family + .env，A/B 會變成「參數 + prompt 配方」
  #    雙變因，整組白測。故在此以 merge key 沿用**同一份** anchor —— 兩組唯一的差異
  #    只有 workflow JSON 的採樣參數與 batch_size，prompt 配方逐字相同。
  #    （`test_all_custom_workflows_are_registered` 也會擋，但擋下來時已經浪費一輪。）
  #
  # _0919 四支的實際改動（依**底模**而非依 Standard/Advanced 決定，這正是原錯配的根因）：
  #   anima_turboV11    → steps 12 / cfg 1    （官方 model card：CFG 1 and 8-12 steps）
  #   anima_aestheticV11→ steps 30 / cfg 3.5  （官方：30-50 steps, CFG 4-6；
  #                                            並採「Aesthetic can tolerate lower CFGs such as 3,
  #                                            and often looks better with them」取區間下緣）
  #   四支一律 batch_size 3 → 1               （後端只取第 1 張，batch 3 等於丟掉 2/3 GPU 時間）
  AnimaStandardV8_Aesthetic_0919.json:
    <<: *anima_aesthetic_turbo
  AnimaStandardV8_trubo11_0919.json:
    <<: *anima_aesthetic_turbo
  AnimaAdvancedV8_Aesthetic_0919.json:
    <<: *anima_aesthetic_turbo
  AnimaAdvancedV8_trubo11_0919.json:
    <<: *anima_aesthetic_turbo

  # ── Anima / anima_baseV10（SYNC-003 B1，2026-09-16：測試流程書 T2「LLLite 上限測試」用）──
  # 檔案由使用者從 AnimaStandardV8_trubo11.json 複製、只改 node 1 unet_name。
  # 先登錄、檔案後放：名單制，檔案不存在時本行零作用；檔案放進來時 SYNC-001 護欄
  # （test_all_custom_workflows_are_registered）不會紅，prompt 配方也與 turbo 組一致（單變因）。
  AnimaStandardV8_base10.json:
    <<: *anima_aesthetic_turbo
