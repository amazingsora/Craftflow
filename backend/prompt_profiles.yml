# Craftflow — Prompt 配方（以底模家族為鍵）
# [CN-114] SYNC-007（2026-09-23）：鍵由「workflow 檔名」改為「底模家族」。
#
# 家族怎麼來：workflow 內嵌 checkpoint（Checkpoint 模式則為全域 checkpoint）
#   → checkpoint_styles.yml 的 `checkpoints:` 區 → PromptStyle 值（illustrious / anima / sdxl / pony …）
#   → 查本檔 families[<值>]。新增或改名 workflow **不必改本檔**，只要底模已在 checkpoint_styles.yml 登錄。
#
# 欄位（皆可省略；省略＝不覆寫，落回下一層）：
#   quality_prefix / quality_suffix / negative（取代）/ negative_extra（附加於 negative 之後）
#   style_extra / style_extra_weight：compile 之後在 character_design_service 組裝的畫風段
#     weight != 1.0 → 每個 tag 加權並前置到 identity 之前；weight == 1.0 → 不加權、接在正向最尾端
#   tag_order：組裝完成後的重排規則。目前只有 subject_first＝quality/safety → 主體（1girl, solo）
#     → 畫風段 → 其餘原序（Anima 官方順序，[CN-116]）。省略＝不重排。
#
# 解析優先序：art_style（DB）> 本檔 families[家族] > prompt_engine/styles.py STYLE_CONFIG（內建）> .env（僅 style_extra）
# 本檔沒寫的家族（sdxl / pony / noobai / flux / anythingxl）＝不介入，用 STYLE_CONFIG 內建值。
# 個案實驗（只想讓某個角色／專案吃不同配方）→ 用 art_style，不要在這裡加 workflow 例外。
#
# 舊版（workflow 檔名為鍵、含 07-12～09-21 全部沿革註解）存於
#   doc/agent_sync/SYNC-007_prompt_profiles_before.yml
# 修改本檔免重啟即生效（_load_prompt_profiles 不快取）。

families:
  illustrious:
    # fabricatedXL_v70 / novaAnimeXL / Illustrious-XL 等。
    # SYNC-007 軌 R（2026-09-23）：換成 ComfyUI 驗證過的 R1 配方（人設圖CN_IPA_V38_workflow.json）。
    #   畫風段改為「不加權、接尾端」（weight 1.0）——舊配方 (flat color:0.7), cel shading, thick outlines @1.2 前置
    #   是平塗主因（SYNC-005）。nsfw/nude 依 §2.5 #3 延後至 SIT 後，不在此配方內。
    #   multiple views / cropped / 背景雜物 / male face 由 character_design_service 的 extra_neg 自動附加，不重複列。
    # 軌 M 以前的舊值：quality_prefix "masterpiece, best quality, absurdres"；
    #   style_extra "(flat color:0.7), cel shading, thick outlines"；style_extra_weight 1.2（回滾用）。
    quality_prefix: "masterpiece, best quality, amazing quality, absurdres"
    style_extra: "anime game illustration, clean lineart, soft shading, crisp edges, bright highlights, detailed eyes, high detail"
    style_extra_weight: 1.0
    negative: >-
      bad quality, worst quality, worst detail, lowres, jpeg artifacts, blurry,
      sketch, rough lineart, monochrome, greyscale,
      bad anatomy, bad hands, bad proportions, extra fingers, missing fingers, fused fingers, extra limbs, deformed,
      photorealistic, 3d, heavy rendering, oily skin, shiny skin,
      artist name, signature, watermark, text, username, patreon, twitter username,
      detailed background, scenery, floor, cast shadow

  anima:
    quality_prefix: "masterpiece, best quality, absurdres, "
    style_extra: ""
    # [CN-116] SYNC-008（2026-09-24）：2.0 → 1.0，並以 tag_order 把畫風段放到 1girl, solo 之後。
    #   ComfyUI 提示詞精度 A/B：A0（2.0 加權前置）不合格、A4/A5（不加權、主體後）合格。
    #   2.0 時 miaomiao 會把 blue archive／畫師名畫成圖底文字（#881）。回滾＝改回 2.0 並刪 tag_order。
    style_extra_weight: 1.0
    tag_order: subject_first
    negative: >-
      worst quality, low quality, lowres, blurry, jpeg artifacts, chromatic aberration,
      bad anatomy, watermark, toddler, chibi, drop shadow, cast shadow,
      floor, ground, reflection
